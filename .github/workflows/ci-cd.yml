name: CI/CD Pipeline for Vite React App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Specify the Node.js version
          cache: 'npm' # Optional: enables caching for npm dependencies

      - name: Install dependencies
        run: npm i

      - name: Run tests and generate coverage report
        run: |
          npm run test:coverage && npm run test:CI

      # Optional: Upload full coverage report as an artifact for later review
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: coverage/
          retention-days: 5

      # Optional: Upload full coverage report as an artifact for later review
      - name: Upload test-report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jest-test-report
          path: test-report/index.html
          retention-days: 10
